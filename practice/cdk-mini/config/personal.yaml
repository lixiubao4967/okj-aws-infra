# ======================================
# 个人 AWS 账号配置 — 请填入你的实际值
# ======================================

# 必填：你的 AWS 账号 ID（12 位数字）
account: "YOUR_AWS_ACCOUNT_ID"

# 必填：部署的 AWS 区域
region: "ap-northeast-1"

# S3 桶配置
s3:
  # 桶名必须全球唯一，建议加上账号后缀避免冲突
  bucketName: "cdk-mini-practice-YOUR_AWS_ACCOUNT_ID"

# SNS Topic 配置
sns:
  topicName: "cdk-mini-notifications"
  displayName: "CDK Mini Practice Notifications"

# DynamoDB 配置
dynamodb:
  tableName: "cdk-mini-tasks"
  # 分区键名称
  partitionKey: "taskId"
