apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# prod 环境特化层
# ArgoCD 监听本目录，ApplicationSet 自动创建 Application: argo-mini-prod-redis

resources:
  - ../../../base/redis

images:
  - name: redis
    newTag: "7-alpine"

replicas:
  - name: redis
    count: 2

patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "0.5"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "0.2"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
    target:
      kind: Deployment
      name: redis
