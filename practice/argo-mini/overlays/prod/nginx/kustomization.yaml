apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# prod 环境特化层
# ArgoCD 监听本目录，ApplicationSet 自动创建 Application: argo-mini-prod-nginx

resources:
  - ../../../base/nginx

images:
  - name: nginx
    newTag: "1.27-alpine"

# prod 环境多副本保障高可用
replicas:
  - name: nginx
    count: 2

# prod 环境 patch：提升资源限制
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "0.5"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "0.2"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 128Mi
    target:
      kind: Deployment
      name: nginx
