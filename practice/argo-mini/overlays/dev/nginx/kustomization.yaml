apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# dev 环境特化层
# ArgoCD 监听本目录，ApplicationSet 自动创建 Application: argo-mini-dev-nginx

resources:
  - ../../../base/nginx

# 覆盖镜像 tag（由 deployer 服务更新，此处为示例固定值）
images:
  - name: nginx
    newTag: "1.27-alpine"

# dev 环境副本数较少
replicas:
  - name: nginx
    count: 1

# dev 环境额外 patch：关闭 progressDeadlineSeconds（加快失败检测）
patches:
  - patch: |-
      - op: replace
        path: /spec/progressDeadlineSeconds
        value: 120
    target:
      kind: Deployment
      name: nginx
