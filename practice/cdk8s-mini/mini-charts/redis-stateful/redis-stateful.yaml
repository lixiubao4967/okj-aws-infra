apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: cdk8s
    app.kubernetes.io/name: redis-stateful
  name: redis-stateful
  namespace: default
spec:
  clusterIP: None
  externalIPs: []
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app.kubernetes.io/name: redis-stateful
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/managed-by: cdk8s
    app.kubernetes.io/name: redis-stateful
  name: redis-stateful
  namespace: default
spec:
  minReadySeconds: 0
  podManagementPolicy: OrderedReady
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-stateful
  serviceName: redis-stateful
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-stateful
    spec:
      automountServiceAccountToken: false
      containers:
        - image: redis:7-alpine
          imagePullPolicy: Always
          name: redis-stateful
          ports:
            - containerPort: 6379
          resources:
            limits:
              cpu: "0.2"
              memory: 256Mi
            requests:
              cpu: "0.1"
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /data
              name: data
      dnsPolicy: ClusterFirst
      hostNetwork: false
      restartPolicy: Always
      securityContext:
        fsGroupChangePolicy: Always
        runAsNonRoot: true
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources: {}
